name: Build NoVNC CEF Client

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest  # 使用最新Windows runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # 使用Node 20 LTS
          cache: 'npm'
          
      - name: Show environment info
        run: |
          node --version
          npm --version
          echo "OS: $env:OS"
          
      - name: Install dependencies
        run: |
          echo "=== Installing dependencies ==="
          npm install
          if ($LASTEXITCODE -ne 0) {
            Write-Host "npm install failed, trying without cache..."
            npm install --no-cache
          }
          
      - name: Build native addon
        run: |
          echo "=== Building native addon ==="
          npm run build:native
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Native addon built successfully"
            if (Test-Path "build/Release/osr_helper.node") {
              Write-Host "osr_helper.node exists"
            }
          } else {
            Write-Host "Native addon build failed (expected on GitHub Actions)"
            Write-Host "Continuing without native module..."
          }
        continue-on-error: true
        
      - name: Build Windows application
        run: |
          echo "=== Building Windows application ==="
          npm run build:win 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed, showing error:"
            Get-Content build.log -Tail 50
            exit 1
          }
          if (!(Test-Path "dist") -or -not (Get-ChildItem "dist" -Recurse -File)) {
            Write-Host "Build finished but dist is empty. Showing build log tail:"
            Get-Content build.log -Tail 80
            exit 1
          }
          Write-Host "Build artifacts:"
          Get-ChildItem "dist" -Recurse -File | Select-Object FullName, Length
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload all build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novnc-client-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7
