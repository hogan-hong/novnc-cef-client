name: Build NoVNC CEF Client

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest  # 使用最新Windows runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # 使用Node 20 LTS
          cache: 'npm'
          
      - name: Show environment info
        run: |
          node --version
          npm --version
          echo "OS: $env:OS"
          
      - name: Install dependencies
        run: |
          npm install
          
      - name: Build native addon
        run: |
          npm run build:native
        continue-on-error: true
        
      - name: Build Windows application
        run: |
          npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Check build output
        run: |
          echo "=== Checking dist directory ==="
          if (Test-Path dist) {
            Write-Host "dist directory EXISTS"
            Get-ChildItem -Recurse dist | Select-Object FullName, Length
          } else {
            Write-Host "dist directory NOT FOUND"
            exit 1
          }
        
      - name: Upload all build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: novnc-client-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7